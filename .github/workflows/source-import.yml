name: Import prepared prototype source
on:
  push:
    branches: [main]
    paths: ['.source-import/ready.json']
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch checksum-pinned one-time import helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib
          base = 'https://raw.githubusercontent.com/blockaystudio/mini-garage-adventure/0644bb0d1e3e4f5e35437fe526072ad9b8db0461/.source-import/'
          files = {'restore.py': '5ed4758bf70398ad4b2f2da43a1645f237fe5044efdc05e83b0fede79e4a692b', 'render.py': '8657986b610ea3b241fe2f0d5f5c679e93a6c3196323f505e8c07a9d97157b80'}
          for name, expected in files.items():
              with urlopen(base + name, timeout=45) as response:
                  data = response.read(200000)
              if hashlib.sha256(data).hexdigest() != expected:
                  raise RuntimeError('Import helper checksum mismatch: ' + name)
              (Path('.source-import') / name).write_bytes(data)
          PY
      - name: Restore verified original text sources
        run: python .source-import/restore.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install test and export dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Rebuild and verify the unchanged prototype
        run: python scripts/verify.py
      - name: Export original artwork and current prototype screenshots
        run: python .source-import/render.py
      - name: Verify source integrity and record import
        run: python .source-import/restore.py --finish
      - name: Commit imported files without changing repository visibility
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import verified prototype source and regenerated review assets'
          git push origin HEAD:main
